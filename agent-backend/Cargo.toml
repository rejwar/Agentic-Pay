[package]
name = "agent-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-backend"
path = "src/main.rs"

[[bin]]
name = "loadtest_submit"
path = "src/bin/loadtest_submit.rs"

[[bench]]
name = "state_machine"
harness = false

[[bench]]
name = "decision_engine"
harness = false

[dependencies]
# JSON-RPC server & client
jsonrpsee = { version = "0.26", features = ["server", "macros", "http-client"] }
clap = { version = "4", features = ["derive"] }

# Solana client
solana-client = "2.1"
solana-sdk = "2.1"
solana-rpc-client = "2.1"
solana-transaction-status-client-types = "2.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
bs58 = "0.5"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "std"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "=0.21.7"
hex = "0.4"
bincode = "1.3"
borsh = "1.5"
sha2 = "0.10"

# Environment & config
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Concurrent data structures
dashmap = "6.0"
governor = "0.6"
nonzero_ext = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
env_logger = "0.11"

# Time
chrono = "0.4"
solana-system-interface = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
